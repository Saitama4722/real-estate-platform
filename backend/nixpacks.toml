# Railway / Nixpacks: gather static files into STATIC_ROOT for WhiteNoise when not using Docker.
[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
# Bind to Railway-injected $PORT (falls back to 8000 for local dev).
cmd = "sh -c 'python manage.py migrate --noinput && python manage.py create_initial_admin && exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60'"
