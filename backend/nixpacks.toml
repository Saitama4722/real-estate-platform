# Railway / Nixpacks: gather static files into STATIC_ROOT for WhiteNoise when not using Docker.
[phases.build]
# The throwaway key mirrors the Dockerfile: collectstatic imports settings, which
# refuse to start in a deployed environment without DJANGO_SECRET_KEY, and build
# time is not guaranteed to have the service variables. Scoped to this command;
# never the runtime key.
cmds = ["DJANGO_SECRET_KEY=build-step-only-never-used-at-runtime python manage.py collectstatic --noinput"]

[start]
# Bind to Railway-injected $PORT (falls back to 8000 for local dev).
cmd = "sh -c 'python manage.py migrate --noinput && python manage.py create_initial_admin && exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60'"
