<!-- @dsCard group="Components" viewport="700x400" subtitle="Кнопки 4 варианта × 3 состояния, размеры, иконочные кнопки, бейджи" name="Кнопки и бейджи" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Кнопки</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../components.css"><style>
body{background:#fff;padding:20px;box-sizing:border-box}
svg.lucide{width:20px;height:20px}
.ctr-btn--sm svg.lucide,.ctr-card__specs svg.lucide,.ctr-field__error svg.lucide,.ic16 svg.lucide{width:16px;height:16px}
.ctr-field__error svg.lucide{width:13px;height:13px}
.ctr-card__addr svg.lucide{width:14px;height:14px}
.ic18 svg.lucide{width:18px;height:18px}.ic24 svg.lucide{width:24px;height:24px}.ic28 svg.lucide{width:28px;height:28px}
.ctr-iconbtn svg.lucide{width:18px;height:18px}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}

.hv.ctr-btn--primary{background:var(--color-primary-hover)}
.hv.ctr-btn--secondary{background:var(--color-primary-tint-2)}
.hv.ctr-btn--outline{border-color:var(--blue-400);background:var(--blue-50);color:var(--blue-700)}
.hv.ctr-btn--ghost{background:var(--neutral-100);color:var(--text-primary)}
.grid{display:grid;grid-template-columns:repeat(4,max-content);gap:10px 12px;align-items:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body>
<div style="display:flex;gap:36px;align-items:flex-start">
<div><p class="lbl">Варианты · default / hover / disabled</p>
<div class="grid">
<button class="ctr-btn ctr-btn--primary">Найти</button><button class="ctr-btn ctr-btn--secondary">Показать ещё</button><button class="ctr-btn ctr-btn--outline"><i data-lucide="map"></i>На карте</button><button class="ctr-btn ctr-btn--ghost">Отмена</button>
<button class="ctr-btn ctr-btn--primary hv">Найти</button><button class="ctr-btn ctr-btn--secondary hv">Показать ещё</button><button class="ctr-btn ctr-btn--outline hv"><i data-lucide="map"></i>На карте</button><button class="ctr-btn ctr-btn--ghost hv">Отмена</button>
<button class="ctr-btn ctr-btn--primary" disabled>Найти</button><button class="ctr-btn ctr-btn--secondary" disabled>Показать ещё</button><button class="ctr-btn ctr-btn--outline" disabled>На карте</button><button class="ctr-btn ctr-btn--ghost" disabled>Отмена</button>
</div>
<p class="lbl" style="margin-top:20px">Размеры sm 32 / md 40 / lg 48 · danger — только деструктив</p>
<div class="row">
<button class="ctr-btn ctr-btn--primary ctr-btn--sm">Продать недвижимость</button>
<button class="ctr-btn ctr-btn--primary"><i data-lucide="search"></i>Найти</button>
<button class="ctr-btn ctr-btn--primary ctr-btn--lg"><i data-lucide="search"></i>Найти</button>
<button class="ctr-btn ctr-btn--danger ctr-btn--sm">Удалить заявку</button>
</div></div>
<div><p class="lbl">Иконочные кнопки</p>
<div class="row">
<button class="ctr-iconbtn" aria-label="В избранное"><i data-lucide="heart"></i></button>
<button class="ctr-iconbtn is-active-fav" aria-label="В избранном"><i data-lucide="heart"></i></button>
<button class="ctr-iconbtn" aria-label="Сравнить"><i data-lucide="scale"></i></button>
<button class="ctr-iconbtn is-active-cmp" aria-label="В сравнении"><i data-lucide="scale"></i></button>
<button class="ctr-iconbtn" aria-label="Поделиться"><i data-lucide="share-2"></i></button>
</div>
<p class="lbl" style="margin-top:20px">Бейджи</p>
<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
<span class="ctr-badge ctr-badge--accent">Цена снижена</span>
<span class="ctr-badge ctr-badge--primary">Новый объект</span>
<span class="ctr-badge ctr-badge--neutral">Продано</span>
<span class="ctr-badge ctr-badge--success">Проверено агентством</span>
</div></div>
</div><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons();</script></body></html>
