<!-- @dsCard group="Motion" viewport="700x400" subtitle="Слева — покой, справа — hover. Карточка: тень + подъём 3px + фото ×1.04, 250ms" name="Состояния: покой / наведение" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Hover</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../components/components.css"><style>
body{background:var(--bg-page);padding:20px;box-sizing:border-box;margin:0}
svg.lucide{width:20px;height:20px}
.ctr-btn--sm svg.lucide,.ctr-card__specs svg.lucide,.ic16 svg.lucide{width:16px;height:16px}
.ctr-card__addr svg.lucide{width:14px;height:14px}
.ctr-iconbtn svg.lucide{width:18px;height:18px}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.cap{font:11px/15px var(--font-sans);color:var(--text-muted);margin:8px 0 0;text-align:center}

.hovered{box-shadow:var(--shadow-md)!important;transform:translateY(-3px)}
.hovered .ctr-card__media img{transform:scale(1.04)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.row{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hv.ctr-btn--primary{background:var(--color-primary-hover)}
.hv.ctr-btn--outline{border-color:var(--blue-400);background:var(--blue-50);color:var(--blue-700)}
.hv.ctr-header__link{color:var(--text-primary);background:var(--neutral-50)}
.hv.ctr-chip{border-color:var(--blue-400);background:var(--blue-50);color:var(--blue-700)}
.hv.ctr-marker{background:var(--color-primary-hover);transform:scale(1.06)}
.hv.ctr-iconbtn{color:var(--text-primary);transform:scale(1.06);box-shadow:var(--shadow-md)}</style></head><body>
<div class="pair">
<div><p class="lbl">Покой</p><div style="display:flex;gap:22px;align-items:flex-start">
<a class="ctr-card" href="#" style="width:250px">
<div class="ctr-card__media"><img src="../assets/photos/listing-severny.png" alt="">
<div class="ctr-card__actions"><button class="ctr-iconbtn" aria-label="Сравнить"><i data-lucide="scale"></i></button><button class="ctr-iconbtn" aria-label="В избранное"><i data-lucide="heart"></i></button></div></div>
<div class="ctr-card__body">
<div class="ctr-card__price">5 000 000 ₽</div>
<div class="ctr-card__specs"><span><i data-lucide="bed-double"></i>1-комн.</span><span><i data-lucide="ruler"></i>45 м²</span><span><i data-lucide="building"></i>8/8 эт.</span></div>
<div class="ctr-card__addr"><i data-lucide="map-pin"></i>Краснодар, п. Северный</div></div></a>
<div class="row">
<button class="ctr-btn ctr-btn--primary">Найти</button>
<button class="ctr-btn ctr-btn--outline"><i data-lucide="map"></i>На карте</button>
<a class="ctr-header__link" href="#">Каталог</a>
<button class="ctr-chip">Краснодар</button>
<span class="ctr-marker">5 000 000 ₽</span>
<button class="ctr-iconbtn" aria-label="В избранное"><i data-lucide="heart"></i></button>
</div></div></div>
<div><p class="lbl">Наведение · 150–250ms ease-out</p><div style="display:flex;gap:22px;align-items:flex-start">
<a class="ctr-card hovered" href="#" style="width:250px">
<div class="ctr-card__media"><img src="../assets/photos/listing-severny.png" alt="">
<div class="ctr-card__actions"><button class="ctr-iconbtn" aria-label="Сравнить"><i data-lucide="scale"></i></button><button class="ctr-iconbtn" aria-label="В избранное"><i data-lucide="heart"></i></button></div></div>
<div class="ctr-card__body">
<div class="ctr-card__price">5 000 000 ₽</div>
<div class="ctr-card__specs"><span><i data-lucide="bed-double"></i>1-комн.</span><span><i data-lucide="ruler"></i>45 м²</span><span><i data-lucide="building"></i>8/8 эт.</span></div>
<div class="ctr-card__addr"><i data-lucide="map-pin"></i>Краснодар, п. Северный</div></div></a>
<div class="row">
<button class="ctr-btn ctr-btn--primary hv">Найти</button>
<button class="ctr-btn ctr-btn--outline hv"><i data-lucide="map"></i>На карте</button>
<a class="ctr-header__link hv" href="#">Каталог</a>
<button class="ctr-chip hv">Краснодар</button>
<span class="ctr-marker hv">5 000 000 ₽</span>
<button class="ctr-iconbtn hv" aria-label="В избранное"><i data-lucide="heart"></i></button>
</div></div></div>
</div><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons();</script></body></html>
