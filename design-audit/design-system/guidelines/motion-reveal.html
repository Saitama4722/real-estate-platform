<!-- @dsCard group="Motion" viewport="700x300" subtitle="Секции: opacity + 16px подъём, стаггер 60ms. Шапка: 64→52px, тень. Живая демонстрация" name="Скролл: появление и шапка" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Скролл</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../components/components.css"><style>
body{background:var(--bg-page);padding:20px;box-sizing:border-box;margin:0}
svg.lucide{width:20px;height:20px}
.ctr-btn--sm svg.lucide,.ctr-card__specs svg.lucide,.ic16 svg.lucide{width:16px;height:16px}
.ctr-card__addr svg.lucide{width:14px;height:14px}
.ctr-iconbtn svg.lucide{width:18px;height:18px}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.cap{font:11px/15px var(--font-sans);color:var(--text-muted);margin:8px 0 0;text-align:center}

body{padding:0;overflow:hidden}
.scroller{height:260px;overflow-y:auto;position:relative}
.pad{height:150px;display:flex;align-items:center;justify-content:center;font:var(--type-small);color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px 40px}
.tile{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px;font:600 15px/20px var(--font-sans)}
.tile span{display:block;font:12px/16px var(--font-sans);color:var(--text-muted);font-weight:400;margin-top:4px}
.ctr-header__in{max-width:none}</style></head><body>
<div class="scroller" id="sc">
<header class="ctr-header" id="hd"><div class="ctr-header__in"><a class="ctr-logo" href="#">Centreal<i></i></a>
<nav class="ctr-header__nav"><a class="ctr-header__link is-active" href="#">Каталог</a><a class="ctr-header__link" href="#">Районы</a></nav>
<div class="ctr-header__cta"><button class="ctr-btn ctr-btn--primary ctr-btn--sm">Продать недвижимость</button></div></div></header>
<p class="pad">↓ Прокрутите: шапка сожмётся до 52px, плитки появятся со стаггером</p>
<div class="grid">
<div class="tile ctr-reveal">Квартиры<span>0ms</span></div>
<div class="tile ctr-reveal d1">Дома<span>60ms</span></div>
<div class="tile ctr-reveal d2">Участки<span>120ms</span></div>
</div>
<p class="pad">Появление срабатывает один раз</p>
</div>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script>
lucide.createIcons();
var sc=document.getElementById('sc'),hd=document.getElementById('hd');
sc.addEventListener('scroll',function(){hd.classList.toggle('is-compact',sc.scrollTop>24);},{passive:true});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{root:sc,threshold:0.12});
document.querySelectorAll('.ctr-reveal').forEach(function(n){io.observe(n);});
</script></body></html>
