<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Тени</title><link rel="stylesheet" href="../styles.css"><style>
body{background:#fff;padding:20px;box-sizing:border-box}
.row{display:flex;gap:8px}
.sw{flex:1;height:96px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--type-caption);letter-spacing:var(--ls-caption)}
.sw code{font-size:11px;opacity:.75;font-family:ui-monospace,monospace}
.lt{color:var(--text-primary)} .dk{color:#fff}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
</style></head><body><div class="row" style="gap:20px;padding:8px 4px">
<div style="flex:1;height:84px;background:#fff;border-radius:12px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><code style="font-family:ui-monospace,monospace;font-size:12px">--shadow-xs</code><span style="font:var(--type-caption);color:var(--text-muted)">разделители</span></div><div style="flex:1;height:84px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><code style="font-family:ui-monospace,monospace;font-size:12px">--shadow-sm</code><span style="font:var(--type-caption);color:var(--text-muted)">карточки</span></div><div style="flex:1;height:84px;background:#fff;border-radius:12px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><code style="font-family:ui-monospace,monospace;font-size:12px">--shadow-md</code><span style="font:var(--type-caption);color:var(--text-muted)">hover, дропдауны</span></div><div style="flex:1;height:84px;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><code style="font-family:ui-monospace,monospace;font-size:12px">--shadow-lg</code><span style="font:var(--type-caption);color:var(--text-muted)">модалки, хиро-панель</span></div>
<div style="flex:1;height:84px;background:#fff;border:1.5px solid var(--blue-600);border-radius:12px;box-shadow:var(--focus-ring);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><code style="font-family:ui-monospace,monospace;font-size:12px">--focus-ring</code><span style="font:var(--type-caption);color:var(--text-muted)">фокус</span></div>
</div></body></html>
