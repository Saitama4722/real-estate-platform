<!-- @dsCard group="Colors" viewport="700x190" subtitle="Статусы и бейдж «Цена снижена»" name="Семантические цвета" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Семантика</title><link rel="stylesheet" href="../styles.css"><style>
body{background:#fff;padding:20px;box-sizing:border-box}
.row{display:flex;gap:8px}
.sw{flex:1;height:96px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--type-caption);letter-spacing:var(--ls-caption)}
.sw code{font-size:11px;opacity:.75;font-family:ui-monospace,monospace}
.lt{color:var(--text-primary)} .dk{color:#fff}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
</style></head><body><div class="row" style="align-items:stretch">
<div style="flex:1;border:1px solid var(--border-default);border-radius:8px;padding:12px"><p class="lbl">Success</p><div class="row"><div class="sw dk" style="background:#1B7A4E"><b></b><code>#1B7A4E</code></div><div class="sw lt" style="background:#EAF6EF"><b></b><code>#EAF6EF</code></div></div></div>
<div style="flex:1;border:1px solid var(--border-default);border-radius:8px;padding:12px"><p class="lbl">Warning</p><div class="row"><div class="sw dk" style="background:#AD5706"><b></b><code>#AD5706</code></div><div class="sw lt" style="background:#FBF1E4"><b></b><code>#FBF1E4</code></div></div></div>
<div style="flex:1;border:1px solid var(--border-default);border-radius:8px;padding:12px"><p class="lbl">Danger</p><div class="row"><div class="sw dk" style="background:#A1272F"><b></b><code>#A1272F</code></div><div class="sw lt" style="background:#F7EAEA"><b></b><code>#F7EAEA</code></div></div></div>
<div style="flex:1;border:1px solid var(--border-default);border-radius:8px;padding:12px;display:flex;flex-direction:column"><p class="lbl">Бейджи</p>
<span style="display:inline-flex;align-self:flex-start;align-items:center;background:var(--badge-price-drop-bg);color:#fff;font:var(--type-caption);letter-spacing:var(--ls-caption);padding:4px 8px;border-radius:6px">Цена снижена</span>
<span style="display:inline-flex;align-self:flex-start;align-items:center;background:var(--color-primary);color:#fff;font:var(--type-caption);padding:4px 8px;border-radius:6px;margin-top:6px">Новый объект</span>
<span style="display:inline-flex;align-self:flex-start;align-items:center;background:var(--bg-inset);color:var(--text-secondary);font:var(--type-caption);padding:4px 8px;border-radius:6px;margin-top:6px">Продано</span></div>
</div></body></html>
