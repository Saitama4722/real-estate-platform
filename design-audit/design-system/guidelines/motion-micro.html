<!-- @dsCard group="Motion" viewport="700x330" subtitle="Живые: сердце, сравнение, переключатель, фокус поля. Кликните" name="Микровзаимодействия" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Микро</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../components/components.css"><style>
body{background:var(--bg-page);padding:20px;box-sizing:border-box;margin:0}
svg.lucide{width:20px;height:20px}
.ctr-btn--sm svg.lucide,.ctr-card__specs svg.lucide,.ic16 svg.lucide{width:16px;height:16px}
.ctr-card__addr svg.lucide{width:14px;height:14px}
.ctr-iconbtn svg.lucide{width:18px;height:18px}
.lbl{font:var(--type-caption);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.cap{font:11px/15px var(--font-sans);color:var(--text-muted);margin:8px 0 0;text-align:center}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.box{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:150px}
.box .lbl{margin:0}</style></head><body>
<div class="grid">
<div class="box"><p class="lbl">Избранное</p><button class="ctr-iconbtn" id="fav" aria-label="В избранное" style="width:44px;height:44px"><i data-lucide="heart"></i></button><p class="cap">заливка + pop 1→1.28→1<br>250ms ease-out</p></div>
<div class="box"><p class="lbl">Сравнение</p><button class="ctr-iconbtn" id="cmp" aria-label="Сравнить" style="width:44px;height:44px"><i data-lucide="scale"></i></button><p class="cap">цвет + фон blue-50<br>250ms ease-out</p></div>
<div class="box"><p class="lbl">Карта / список</p><div class="ctr-seg"><button class="ctr-seg__btn is-active"><i data-lucide="map"></i></button><button class="ctr-seg__btn"><i data-lucide="list"></i></button></div><p class="cap">пилюля переезжает<br>250ms ease-out</p></div>
<div class="box"><p class="lbl">Фокус поля</p><input class="ctr-input" placeholder="Кликните сюда" style="width:100%"><p class="cap">border + ring 3px<br>200ms ease-out</p></div>
</div>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script>
lucide.createIcons();
function pop(b){b.classList.remove('is-popping');void b.offsetWidth;b.classList.add('is-popping');}
document.getElementById('fav').addEventListener('click',function(){this.classList.toggle('is-active-fav');pop(this);});
document.getElementById('cmp').addEventListener('click',function(){this.classList.toggle('is-active-cmp');pop(this);});
document.querySelectorAll('.ctr-seg').forEach(function(s){s.querySelectorAll('.ctr-seg__btn').forEach(function(b){b.addEventListener('click',function(){s.querySelectorAll('.ctr-seg__btn').forEach(function(x){x.classList.remove('is-active')});b.classList.add('is-active');});});});
</script></body></html>
